version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: asana_db
      POSTGRES_USER: asana_user
      POSTGRES_PASSWORD: asana_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asana_user -d asana_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "
      echo 'Waiting for database...' &&
      while ! nc -z db 5432; do sleep 1; done &&
      echo 'Database is ready!' &&
      python manage.py migrate &&
      python manage.py populate_sample_data &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_NAME=asana_db
      - DB_USER=asana_user
      - DB_PASSWORD=asana_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/1.0/users/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: